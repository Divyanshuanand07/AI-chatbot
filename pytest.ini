[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests
addopts =
    -q
    --strict-markers
    --tb=short
    --reuse-db
markers =
    slow: tests that take noticeably longer to run
filterwarnings =
    error::DeprecationWarning:apps.*
